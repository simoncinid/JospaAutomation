services:
  - type: worker
    name: jospa-email-worker
    env: python
    buildCommand: pip install -r requirements_render.txt
    startCommand: python render_worker.py
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TENANT_ID
        value: ee6b29b7-6376-4655-9712-8096e78247f1
      - key: CLIENT_ID
        value: 312ac792-f712-4e91-94ac-91f2d858b52b
      - key: CLIENT_SECRET
        sync: false  # Configurare come secret in Render dashboard
      - key: SENDER_EMAIL
        value: f.defin@defincouverture.fr
      - key: GOOGLE_SHEET_ID
        value: 1mSUd-XsPTABEbSZBc5whTdLUlid_Z0WbTIfsS4eXqUk
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false  # Configurare come secret in Render dashboard
      - key: TIMEZONE
        value: Europe/Rome
      - key: DAILY_TASK_TIME
        value: "06:00"
      - key: SEARCH_KEYWORD
        value: facture
      - key: WEEKS_BEFORE_FIRST_EMAIL
        value: "2"
      - key: WEEKS_BEFORE_SECOND_EMAIL
        value: "1"
      - key: MAIN_SHEET_NAME
        value: Foglio1
      - key: BLACKLIST_SHEET_NAME
        value: Foglio2
      - key: ENABLE_IMMEDIATE_TEST
        value: "false" 